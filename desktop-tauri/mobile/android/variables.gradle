ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'

    // APK 的 versionName / versionCode 取自 mobile/package.json —— 单一来源，
    // 不必在打每次包前手改 gradle。版本号本身由根 package.json 统一维护。
    //
    // versionCode 必须是整数且只增不减（Android 靠它判「这是不是升级」）：
    // 把 semver 的前三段按 major*10000 + minor*100 + patch 折算，
    // 3.1.0 → 30100、3.1.1 → 30101、3.10.0 → 31000。
    // 预发布后缀（-beta.1）不参与折算 —— 它比同号正式版小，但 Android
    // 只认整数，这里取同号值；beta 与正式版不会同时发布，不构成冲突。
    def mobilePkg = new groovy.json.JsonSlurper().parse(
        new File(rootProject.projectDir, '../package.json')
    )
    def semver = mobilePkg.version.tokenize('-')[0].tokenize('.')
    apkVersionName = mobilePkg.version
    apkVersionCode = semver[0].toInteger() * 10000 +
                     semver[1].toInteger() * 100 +
                     (semver.size() > 2 ? semver[2].toInteger() : 0)
}
