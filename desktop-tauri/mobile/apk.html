<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover：让安全区（刘海 / 底部横条）由 env() 接管，
     全屏时内容不会钻到系统栏下面。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f3f3f6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
<meta name="color-scheme" content="light dark" />
<meta name="format-detection" content="telephone=no" />
<title>Agent2API</title>

<link rel="stylesheet" href="mobile.css" />

<script>
  // 语言引导：与 ui/m.html / index.html 同一套解析规则（改一处必须同步改另两处）。
  // 必须早于业务脚本，否则首屏会先按简体渲染再跳一下。
  //
  // 与浏览器形态的差别：APK 里的词典是**打包进来**的（构建时从 ui/i18n 拷到
  // android-www/i18n），不是网关托管，所以路径是相对本文件的 `i18n/...`。
  (function () {
    var CODES = ['zh-Hans', 'zh-Hant', 'en', 'ja', 'ko', 'pt-BR'];
    var raw = null;
    try { raw = localStorage.getItem('workbuddy-desktop-locale'); } catch (e) { /* 存储被禁 */ }
    var locale = 'en';
    if (raw && raw !== 'auto' && CODES.indexOf(raw) >= 0) {
      locale = raw;
    } else {
      var tags = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
      for (var i = 0; i < tags.length; i++) {
        var tag = String(tags[i] || '').toLowerCase();
        if (!tag) continue;
        if (tag === 'zh-tw' || tag === 'zh-hk' || tag === 'zh-mo' || tag.indexOf('hant') >= 0) { locale = 'zh-Hant'; break; }
        if (tag.indexOf('zh') === 0) { locale = 'zh-Hans'; break; }
        if (tag.indexOf('ja') === 0) { locale = 'ja'; break; }
        if (tag.indexOf('ko') === 0) { locale = 'ko'; break; }
        if (tag.indexOf('pt') === 0) { locale = 'pt-BR'; break; }
      }
    }
    document.documentElement.lang = locale;
    // 简体没有词典目录（查不到即显示简体原文）；其余语言注入 manifest + 各域文件。
    if (locale === 'zh-Hans') return;
    document.write('<script src="i18n/manifest.js"><\/script>');
    var domains = window.__WB_I18N_DOMAINS || [];
    for (var d = 0; d < domains.length; d++) {
      document.write('<script src="i18n/' + locale + '/' + domains[d] + '.js"><\/script>');
    }
  })();
</script>

<script>
  // 主题引导：在首帧之前把 data-theme 定下来，避免浅色闪一下再切深色。
  (function () {
    var mode = 'system';
    try { mode = localStorage.getItem('workbuddy-desktop-theme') || 'system'; } catch (e) { /* 忽略 */ }
    if (mode !== 'light' && mode !== 'dark') mode = 'system';
    document.documentElement.dataset.theme = mode;
    var dark = mode === 'dark' || (mode === 'system'
      && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < metas.length; i++) {
      metas[i].setAttribute('content', dark ? '#0a0a0a' : '#f3f3f6');
      if (i === 0) metas[i].removeAttribute('media');
    }
  })();
</script>
</head>
<body>
<div id="root"></div>
<!-- APK 里没有 Service Worker：界面来自包内文件，不经过 HTTP，离线本来就能开。
     数据请求照常打网关，连不上时各页面自己报错。 -->
<script src="mobile.js"></script>
</body>
</html>
