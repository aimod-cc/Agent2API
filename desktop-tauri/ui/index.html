<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ─── PWA：让 iOS「添加到主屏幕」后以独立窗口打开（不是每次都跳回 Safari）───
       iOS 只认 manifest 里 display: standalone + apple-touch-icon；没有这套声明，
       主屏幕图标点击会退回 Safari。注意：加了之后用户必须删掉旧书签重新添加。 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agent2API">
  <meta name="theme-color" content="#0f1115">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/app-icon-180.png">
  <link rel="icon" type="image/png" href="assets/app-icon-192.png">
  <title data-i18n="Agent2API · 多提供商本地网关">Agent2API · 多提供商本地网关</title>
  <script>
    // ── 桌面端的面板登录守卫 ──────────────────────────────────
    // 只有「注册过管理员」之后才需要登录（未注册 = 桌面当正常软件用，免登录）。
    // 判据与网页端 `panel_boot_redirect` 同源（服务端判的是浏览器导航），但桌面
    // 窗口的页面来自 tauri://，服务端看不到这次导航，只能在页面侧拦。
    //
    // 为什么要先藏一下：判断要问壳（异步），而页面主体一旦开始渲染，注册过管理员
    // 的用户会先看到整块界面再被跳走。`data-auth-pending` 由下面的首屏样式隐藏，
    // 判定完成后移除 —— 最坏情况是几十毫秒空白，而不是闪一屏主界面。
    (function () {
      var desktop = window.workbuddyDesktop;
      if (!desktop || desktop.platform === 'web'
        || typeof desktop.panelSessionStatus !== 'function') return;
      document.documentElement.dataset.authPending = '1';
      desktop.panelSessionStatus().then(function (state) {
        if (state && state.registered && !state.authenticated) {
          // replace 而不是 assign：登录页不该出现在「后退」栈里
          window.location.replace('login.html');
          return;
        }
        delete document.documentElement.dataset.authPending;
      }).catch(function () {
        // 查不到状态（后端还没起来 / 桥异常）：不拦，按免登录处理 ——
        // 各面板自己的 401 提示会说明问题，比停在一个空白页好
        delete document.documentElement.dataset.authPending;
      });
    })();
  </script>
  <style>
    /* 登录守卫生效期间藏住首屏（见上面那段脚本）。放在 head 里而不是外链 CSS：
       要在 CSS 解析前就命中，否则首屏仍会闪一下。 */
    html[data-auth-pending] body { visibility: hidden; }
  </style>
  <script>
    // 与主题持久化配合：在 CSS 解析前先贴上 data-theme，避免深色模式首屏闪烁
    (() => {
      const mode = localStorage.getItem('workbuddy-desktop-theme') || 'system';
      document.documentElement.dataset.theme = mode;
      const dark = mode === 'dark'
        || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      // 界面缩放（设置页「显示」）也在这里抢先交一次：缩放是 WebView 层的效果，
      // 不存在「先贴个属性」这种同步办法，只能尽早发命令 —— 晚了首屏会看到缩放跳一下。
      // 这只是**尽力而为**的反闪烁：桥（workbuddyDesktop）此时已由壳注入（初始化脚本
      // 先于页面脚本执行），但命令异步生效且失败不重试；权威的一次在 app.js 的启动
      // 路径上（applyZoom(storedZoom())）—— 同一份 localStorage，重复应用无副作用。
      const zoom = Number(localStorage.getItem('workbuddy-desktop-zoom'));
      if (Number.isFinite(zoom) && zoom >= 80 && zoom <= 130) {
        try { window.workbuddyDesktop?.setZoom?.(zoom / 100); } catch { /* 浏览器直开忽略 */ }
      }
    })();
  </script>
  <script>
    // 语言引导：在 head 解析期定下界面语言，再同步注入词典 —— 必须早于所有业务脚本，
    // 否则首屏会先按简体渲染再跳一下。解析规则与 ui/i18n.js 的 resolveLocale 逐字一致
    // （那份供运行时查表用，这份供词典注入用，因为 i18n.js 本身也要等这段先定语言；
    // 改一处必须同步改另一处与 login.html）。
    (function () {
      var CODES = ['zh-Hans', 'zh-Hant', 'en', 'ja', 'ko', 'pt-BR'];
      var raw = null;
      try { raw = localStorage.getItem('workbuddy-desktop-locale'); } catch (e) { /* 存储被禁：按 auto 处理 */ }
      var locale = 'en';
      if (raw && raw !== 'auto' && CODES.indexOf(raw) >= 0) {
        locale = raw;
      } else {
        var tags = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
        for (var i = 0; i < tags.length; i++) {
          var tag = String(tags[i] || '').toLowerCase();
          if (!tag) continue;
          if (tag === 'zh-tw' || tag === 'zh-hk' || tag === 'zh-mo' || tag.indexOf('hant') >= 0) { locale = 'zh-Hant'; break; }
          if (tag.indexOf('zh') === 0) { locale = 'zh-Hans'; break; }
          if (tag.indexOf('ja') === 0) { locale = 'ja'; break; }
          if (tag.indexOf('ko') === 0) { locale = 'ko'; break; }
          if (tag.indexOf('pt') === 0) { locale = 'pt-BR'; break; }
        }
      }
      document.documentElement.lang = locale;
      // 简体没有词典目录（查不到即显示简体原文），不必注入；其余语言注入 manifest + 各域文件。
      // locale 已过白名单校验，拼进 src 安全；某域文件缺失时该 <script> 404，静默无害。
      if (locale === 'zh-Hans') return;
      document.write('<script src="i18n/manifest.js"><\/script>');
      var domains = window.__WB_I18N_DOMAINS || [];
      for (var d = 0; d < domains.length; d++) {
        document.write('<script src="i18n/' + locale + '/' + domains[d] + '.js"><\/script>');
      }
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/page-accounts.css">
  <link rel="stylesheet" href="css/page-accounts-providers.css">
  <!-- 账号页表格化（四家混排的一张表）：排在两个账号页样式之后 ——
       它要覆盖 page-accounts.css 里 .acct-scroll 的滚动方向等既有声明 -->
  <link rel="stylesheet" href="css/page-accounts-table.css">
  <link rel="stylesheet" href="css/page-gateway.css">
  <link rel="stylesheet" href="css/page-agent.css">
  <link rel="stylesheet" href="css/page-logs.css">
  <link rel="stylesheet" href="css/page-tasks.css">
  <link rel="stylesheet" href="css/page-checkin.css">
  <link rel="stylesheet" href="css/page-requests.css">
  <link rel="stylesheet" href="css/page-settings.css">
  <!-- 设置 → 显示 → 侧边栏菜单（分组卡片 / 拖拽把手 / 行网格）。排在
       page-settings.css 之后：它复用那里的面板骨架，只补自己的零件 -->
  <link rel="stylesheet" href="css/page-sidebar-pane.css">
  <!-- 更新日志（Markdown 正文 / 版本卡片 / 导航更新提示）：排在页面样式之后，
       需要时可覆盖 page-settings.css 里为旧的纯文本说明写的规则 -->
  <link rel="stylesheet" href="css/update-notes.css">
  <link rel="stylesheet" href="css/page-report.css">
  <!-- AI 助手页（智能组）：消息流 / 工具卡 / 确认卡 / 输入区。排在页面样式之后，
       它是一个新页面，没有需要覆盖的既有规则 -->
  <link rel="stylesheet" href="css/page-assistant.css">
  <!-- 小问号提示外观（tooltip.js 增强出来的气泡）：排在页面样式之后，
       需要时可覆盖各页面自己写的尺寸约束 -->
  <link rel="stylesheet" href="css/tooltip.css">
  <!-- 表格列设置：必须排在所有页面样式之后 ——
       列对齐是**用户配置**，要盖过各表为「这一列靠哪边」写死的默认值
       （.models-table th.r / .acct-table td.cell-pick / .req-head .req-dur …），
       靠级联顺序取胜而不是堆特异性。与 tooltip.css 同一编排。
       （select.css 已随 select.js 一并删除：全站最后一个原生 <select> 换成组件库的
       Select 之后，.select-shell 那一族样式再无任何引用。） -->
  <link rel="stylesheet" href="css/table-col-settings.css">
  <!-- 移动端适配层：最后加载，断点 768px。不动既有 900px 折叠规则，
       只处理 768px 以下真机小屏：侧边栏抽屉化 + 表格卡片化 + 卡片堆叠 -->
  <link rel="stylesheet" href="css/mobile.css">
  <!-- 组件库产物（desktop-tauri/ui-kit/，由 ui-islands 构建时一并编译成 ui/islands/ui.css）：
       Tailwind 的 theme + utilities 两层，刻意不含 preflight —— 基础重置仍由 tokens.css
       承担，否则 h1-h6 字号、列表缩进、img 显示方式会被整体重置。
       排在最后：工具类带 !important（原因见 ui-kit/styles/globals.css 顶部），
       顺序其实已不影响结果，但保持「后加载的是更新的体系」这条阅读线索。 -->
  <link rel="stylesheet" href="islands/ui.css">
  <!-- 多语言运行时：查表 t() + 静态文案扫描器（data-i18n 系列）。
       词典已由上面 head 里的引导脚本同步注入（document.write），这里只放运行时逻辑。
       必须排在 units.js / app.js 等业务脚本之前 —— 它们在加载期就可能读 window.wbI18n；
       排在 head 末尾天然满足。 -->
  <script src="i18n.js"></script>
</head>
<body>
  <div class="shell">
    <!-- 移动端侧边栏抽屉开关（仅 <768px 生效，见 css/mobile.css）。
         checkbox 本身隐藏，label.for 指向的汉堡按钮与遮罩都靠 :checked ~ 兄弟选择器驱动，
         不依赖任何 JS；桌面端整条不影响布局。
         tabindex="-1"：它带着 aria-hidden 却是文档里第一个可聚焦元素，而隐藏只靠
         opacity + pointer-events（这条规则在媒体查询之外，桌面端同样生效）—— 不加这一条，
         桌面用户第一次按 Tab 焦点会落在一个看不见的控件上，同时构成 axe 的
         aria-hidden-focus 违规。抽屉仍由 label 点击驱动，不受影响。 -->
    <input type="checkbox" id="nav-toggle" class="nav-toggle-input" tabindex="-1" aria-hidden="true">
    <!-- ─── 左侧导航 ─── -->
    <aside class="sidebar">
      <div class="brand">
        <!-- 品牌标由 icons.js 注入（与应用图标 icon.png 同一造型，见 icons.js 的 brand 项） -->
        <div class="brand-logo"></div>
        <div class="brand-text">
          <h1>Agent2API</h1>
        </div>
      </div>

      <!-- 图标由 icons.js + app.js 注入（内联 SVG，见 icons.js 顶部说明） -->
      <!-- 导航项由 sidebar-layout.js + app.js 在启动时**渲染**，这里只留空容器。
           为什么不再写静态 DOM：分组、组内顺序、显隐都是用户在
           「设置 → 显示 → 侧边栏菜单」里可改的偏好，静态 DOM 无法表达。
           渲染规则（默认分组 / 校验 / 升级补位）只有一处：ui/sidebar-layout.js。
           下面这些**契约**在动态渲染时必须原样保留，破坏任何一条都会静默失效：
             · 每个菜单是 <button class="nav-item" data-page="<键>">，键与 app.js 的
               PAGES / PAGE_LABELS 逐字一致（localStorage 记忆、showPage、CSS 的
               [data-page] 选择器都依赖它）；
             · 三颗角标的 id：nav-count-requests / nav-count-logs / nav-count-update
               —— app.js 的徽标逻辑按 id 取元素，找不到就静默不亮；
             · 分组标题用 .nav-group-label，窄屏（≤900px）由 layout.css 整列隐藏。 -->
      <nav class="nav" id="nav"></nav>

      <div class="sidebar-foot">
        <!-- 网关状态：常驻显示，不必切到「网关」页也能确认服务是否在监听。
             只说**网关进程**这一件事（进程在不在监听，判据来自壳侧，
             不依赖 HTTP 能否应答）。曾经还有第二条「可用账号」，与它拆成
             两个独立事实；账号那行已按需求移除 —— 有没有账号、几个可用，
             账号页的筛选器与状态列本来就是权威出处。 -->
        <div class="sidebar-status" id="sidebar-status" title="本地网关监听状态" data-i18n-title="本地网关监听状态">
          <!-- 状态行与两个出口由 React 岛渲染（ui-islands/src/islands/port-panel.tsx）：
               岛直接挂在这个 div 上（.sidebar-status 的子元素是 flex 布局，中间插一层
               宿主会破坏排版），所以这里不再有静态子节点，class / id / title 保留。
               对外仍是 window.wbPortPanel = { render, sync, portLabel, isReady }。 -->
        </div>
        <div class="theme-switch" id="theme-switch">
          <button data-mode="system" data-i18n="跟随系统">跟随系统</button>
          <button data-mode="light" data-i18n="浅色">浅色</button>
          <button data-mode="dark" data-i18n="深色">深色</button>
        </div>
        <!-- 手机端入口：同一份面板在窄屏上的另一种排布（`/m`，独立页面，
             与这一页不共享布局）。放侧栏底部而不是一级菜单里 —— 它是
             「换个设备继续看」，不是第 14 个功能页。新标签打开，不打断当前操作。 -->
        <a class="sidebar-mobile-link" href="/m" target="_blank" rel="noopener" data-i18n="手机端打开">手机端打开</a>
      </div>
    </aside>

    <!-- ─── 主区域 ─── -->
    <main class="main">
      <header class="topbar">
        <!-- 移动端汉堡按钮：仅 <768px 显示，点击切换 #nav-toggle 让侧边栏滑出（纯 CSS）。
             内联 SVG 与 icons.js 同一套约定（24×24 画布 + currentColor 填充），
             不依赖 paintIcons 的注入时序 —— 那是页面级图标，这里要首帧就在。 -->
        <label for="nav-toggle" class="mobile-menu-btn" title="菜单" aria-label="切换菜单">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true">
            <path d="M3 6h18v2.5H3V6Zm0 5.25h18v2.5H3v-2.5Zm0 5.25h18v2.5H3v-2.5Z"/>
          </svg>
        </label>
        <div class="crumb">
          <span>Agent2API</span>
          <span class="sep">/</span>
          <span class="cur" id="crumb-page" data-i18n="报表">报表</span>
        </div>
        <div class="spacer"></div>
        <div class="topbar-actions" id="topbar-status"></div>
      </header>

      <div class="content">
        <div class="content-inner">

        <!-- ─── AI 助手（智能）───
             对话页：消息流 + 工具调用卡 + 改动确认卡 + 输入区，整页由 React 岛渲染
             （ui-islands/src/islands/assistant-page.tsx）。对话请求走
             `POST /api/assistant/chat`（SSE，直接 fetch 到网关基址 —— 不走壳的桥：
             桥没有流式、且 60 秒总超时会把长回答截断，见后端 api::assistant 模块头）。
             对外是 window.wbAssistant = { activate }。 -->
        <section class="page" data-page="assistant"></section>

        <!-- ─── 报表（内部标识仍是 overview，见 app.js 的 PAGES）───
             整页由 React 岛渲染（desktop-tauri/ui-islands/src/islands/report-page.tsx，
             随 islands/ui.js 一起加载）。岛直接挂在这个 section 上、不套宿主 div。
             图表全部手写 SVG、不依赖任何图形库，用 ResizeObserver 重绘（改窗口 / 切列数
             都能自适应）。对外仍是 window.wbReport = { load, render, lastSummary,
             applyAutoRefresh }。 -->
        <section class="page active" data-page="overview"></section>

        <!-- ─── 账号 ───
             整页由 React 岛渲染（desktop-tauri/ui-islands/src/islands/accounts-page.tsx，
             随 islands/ui.js 一起加载）。岛直接挂在这个 section 上、不套宿主 div。
             这一页是四家账号混排的一张表：优先级在后端是**全局唯一**的一条队列，
             按优先级升序排行、转发时逐个尝试（见 priority.rs / rotate.rs 的模块头）。
             对外仍是 window.wbAccountsView / wbAccountsModel / wbAccountPanel 等接口。
             表骨架（colgroup + thead 的 th[data-col]）由岛渲染，顺序与原先写死的完全一致，
             列显隐 / 顺序仍由 wbColSettings.syncStaticHead 就地重排。 -->
        <section class="page" data-page="accounts"></section>

        <!-- ─── 签到中心 ───
             整页由 React 岛渲染（desktop-tauri/ui-islands/src/islands/checkin-page.tsx，
             随 islands/ui.js 一起加载）。岛直接挂在这个 section 上、不套宿主 div。
             数据入口是聚合快照 GET /api/checkin-center（分组与「今日已签」的判定
             在后端，与批量签到同一对判据）；新手任务 / 活动福利的资格状态是
             上游查询，页面拿到账号清单后按需惰性查询，快照本身零上游请求。
             对外契约 window.wbCheckinPanel = { load }（app.js 切页时调）。 -->
        <section class="page" data-page="checkin"></section>

        <!-- ─── 模型管理（内部标识仍是 gateway：localStorage 记忆与 CSS 选择器都依赖它）───
             整页由 React 岛渲染（desktop-tauri/ui-islands/src/islands/models-page.tsx，
             随 islands/ui.js 一起加载）。岛直接挂在这个 section 上、不套宿主 div ——
             页面 CSS 用 .page 的直接子选择器（.panel 是它的直接子元素），中间插一层
             会破坏 .panel 的布局。对外仍是 window.wbModelsPanel 与 window.wbModelsCustom。
             这一页的**页面骨架类名照旧**（.panel / .panel-head / .mm / .prov-rail /
             .models-table-wrap / .models-table / .panel-foot …），换掉的只是里面的控件。
             表骨架（colgroup + thead 的 th[data-col]）也由岛渲染，但顺序与这里原先
             写死的完全一致，列显隐 / 顺序仍由 wbColSettings.syncStaticHead 就地重排。 -->
        <section class="page" data-page="gateway"></section>

        <!-- ─── Agent（本机 AI 客户端的配置接管）───
             整页由 React 岛渲染（ui-islands/src/islands/agent-page.tsx），
             岛直接挂在这个 section 上、不套宿主 div —— 页面 CSS 用 .page 的
             直接子选择器（.panel 是它的直接子元素），中间插一层会破坏布局。
             两种客户端形态（单配置 / 多配置）的区别见该岛的文件头。 -->
        <section class="page" data-page="agent"></section>

        <!-- ─── 网络代理 ───
             出口（代理池）的配置中心：新增 / 编辑 / 删除 / 启停 / 测试连通性，
             外加「同步 Clash Verge」—— 把 Clash 当前的出口集合整体镜像进来
             （名称与端口跟随 Clash，因此那类条目的编辑 / 删除只读；
             但「启用」这一列是可用的 —— 那个开关是本页的本地开关，
             镜像条目也能关，见 proxies-page.tsx 的「启用列」一节；
             进本页时也会自动同步一次）。账号弹窗的「出网代理」可选「已保存的代理」，
             引用的就是这里的条目。整页由 React 岛渲染
             （ui-islands/src/islands/proxies-page.tsx，随 islands/ui.js 一起加载），
