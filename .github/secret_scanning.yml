# secret scanning / push protection 路径排除清单（GitHub 官方机制：
# 「Excluding folders and files from secret scanning」，键为 paths-ignore）。
#
# 下列文件含有**第三方官方客户端自带**的公开凭证 —— 不是本仓库的机密，
# 也不能改写（改了对应提供商的登录链路就断了），因此按整文件排除，
# 避免历史告警反复出现、push protection 拦截触碰这些值的推送：
#
# 1. providers/antigravity/endpoints.rs —— Google 官方 Antigravity 客户端
#    随安装包分发的公开 OAuth client_id / client_secret（全网开源实现原样
#    公开；本仓文件头注释也写明「公开客户端凭证，不是用户机密」）。
#    用于 Antigravity 提供商的 Google 账号网页登录（oauth.rs）。
# 2. providers/orcaterm/login.rs —— 腾讯 OrcaTerm 官方自己的微信开放平台
#    AppID（其登录页 302 跳转 URL 里明文可见的公开标识符；微信的机密是
#    AppSecret，本仓没有）。该值在文件里仅出现在注释中。
#
# 注意：此配置按仓库默认分支（main）读取，改动合入 main 后才生效；
# 命中的已有告警会被自动关闭（理由：ignored by configuration）。
# 不要往本文件写入任何密钥明文 —— 本文件自身不在排除清单里，写了反而会触发告警。
paths-ignore:
  - "desktop-tauri/src-tauri/server/src/server/core/providers/antigravity/endpoints.rs"
  - "desktop-tauri/src-tauri/server/src/server/core/providers/orcaterm/login.rs"
