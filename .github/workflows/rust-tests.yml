name: rust-tests

on:
  push:
    branches: [main, beta]
    paths:
      - 'desktop-tauri/src-tauri/**'
      - 'scripts/cargo-test.mjs'
      - '.github/workflows/rust-tests.yml'
      - 'package.json'
  pull_request:
    branches: [main, beta]
    paths:
      - 'desktop-tauri/src-tauri/**'
      - 'scripts/cargo-test.mjs'
      - '.github/workflows/rust-tests.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: '0'

jobs:
  server:
    name: 服务端测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target
          cache-on-failure: true
      - name: 单元测试
        run: node scripts/cargo-test.mjs

  coverage:
    name: 服务端覆盖率报告
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/beta')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target
          key: coverage
      - name: 生成覆盖率
        run: |
          node -e "require('node:fs').mkdirSync('target/coverage', { recursive: true })"
          node scripts/cargo-test.mjs --coverage --lcov --output-path ../../target/coverage/lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: target/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
