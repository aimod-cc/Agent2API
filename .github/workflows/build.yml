name: build

# 构建桌面端安装包并挂到 GitHub Release 上。
#
# ── 为什么需要 CI 构建 ─────────────────────────────────────────
# Tauri 的 macOS 产物（.app / .dmg）**只能在 macOS 上生成**，无法从 Windows
# 交叉编译。因此 Windows 上开发、又要出 Mac 包时，只能借助 CI 的 macOS runner。
# 本仓库是公开仓库，标准 GitHub-hosted runner（含 macOS）对公开仓库免费且
# 不计分钟数 —— macOS runner 是私有仓库里最贵的一档，公开仓库没有这个问题。
#
# ── 触发方式 ──────────────────────────────────────────────────
#   · 手动 workflow_dispatch（在 Actions 页面选分支触发）：
#     三个平台一起构建，产物作为 workflow artifact 下载，不发布 Release
#   · 推送 v* tag：与 docker.yml 同时触发，一次打 tag 安装包与镜像全出；
#     Windows/macOS 包与 Linux 服务端包只挂 workflow artifact —— GitHub
#     Release 由发版收尾脚本在本地挂载（scripts/release.sh）：Release 本就
#     不自动建，安装包只挂 artifact 让构建与发布解耦，发布那步重跑脚本即可
#
# ── action 版本为什么都钉在大版本 v7（本次升级）─────────────────
# 原先用 checkout@v4 / setup-node@v4 / upload-artifact@v4，三者都跑在
# Node.js 20 上，而 GitHub 已宣布 Node 20 弃用、runner 会强制它们跑在
# Node 24（构建日志里那条 deprecation 注解就是这么来的）。
# 各版本对 Node runtime 的支持（查各 action 的 action.yml 得到）：
#   checkout       v4=node20  v5+=node24
#   setup-node     v4=node20  v5+=node24
#   upload-artifact v4=node20 v5=node20  v6+=node24
# 所以三个都升到 v7 —— 直接取最新大版本，不停在 v5/v6 那种「刚够用但已落后」
# 的中间版本上。v7 的 breaking change 与本文件的用法都不冲突：
#   · checkout v6 把凭据挪到单独文件、v7 阻止 workflow_run 检出 fork PR
#     —— 本工作流是 workflow_dispatch，不涉及；
#   · setup-node v5 起会对有 packageManager 字段的项目**自动开启缓存**，
#     本项目两个 package.json 都没有那个字段，行为不变（见下面显式 cache 说明）；
#   · upload-artifact v7 新增的 archive:false 直传与 ESM 化都是增量能力，
#     name + path 的用法逐字不变。
#
# ── npm 缓存（本次一并加上）───────────────────────────────────
# 原先只缓存了 Rust 依赖，npm 每次都全量下载。setup-node 的 cache 选项
# 需要显式指定 cache-dependency-path：本项目的依赖装在 desktop-tauri/ 下，
# 而根 package.json 没有依赖，指错路径会让缓存 key 永远命中不了
# （甚至因为找不到 lock 文件而直接报错）。
#
# ── 签名 ──────────────────────────────────────────────────────
# 默认**不签名**（ad-hoc）。macOS 上未签名的应用 Gatekeeper 会拦下，
# 用户需要在「系统设置 → 隐私与安全性」里手动放行一次。要消除这一步需要
# Apple Developer 账号（$99/年）做 Developer ID 签名 + 公证，届时在仓库里配
# APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY /
# APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID 这几个 secret 即可，
# tauri-action 与 tauri CLI 会自动完成签名与公证。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  RUST_BACKTRACE: 1

jobs:
  # ── macOS ─────────────────────────────────────────────────
  macos:
    # macos-latest 是 Apple Silicon（M1）。这里用 universal 目标同时产出
    # x86_64 与 aarch64 两个架构并合并，Intel 与 M 芯片都能原生运行 ——
    # 代价是 Rust 部分要编两遍，缓存命中时约十几分钟。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # 依赖在 desktop-tauri/ 下（根 package.json 没有依赖），必须显式指路
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal 需要两个目标都装上（合并时两个架构各编一遍）
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # 缓存 Rust 依赖：冷编译约 10 分钟，命中后大幅缩短。
      # key 里带上 Cargo.lock 的哈希，依赖变动时自动失效。
      # target 路径按 .cargo/config.toml 的 target-dir 指向仓库根的 target/
      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: 安装桌面端依赖
        run: npm --prefix desktop-tauri ci

      # 不走 tauri-action：它的默认脚本是 `npm run tauri build`，而本项目的
      # package.json 里那条脚本叫 `build`（见 desktop-tauri/package.json）。
      # 直接用 CLI 更直白，也少一层 action 的版本耦合。
      - name: 构建 macOS 安装包
        run: npm --prefix desktop-tauri run build -- --target universal-apple-darwin

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          # 只取 .dmg：bundle 目录下还有 .app 与 .dSYM 等调试产物，
          # 它们不是分发形态（用户要的是 dmg），传上去只会白占存储
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ── Windows ─────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # 同 macOS job：依赖在 desktop-tauri/ 下
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: 安装桌面端依赖
        run: npm --prefix desktop-tauri ci

      - name: 构建 Windows 安装包
        run: npm --prefix desktop-tauri run build

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ── Linux 服务端包（容器内一键更新的 Release 资产）──────────
  # 面板在容器里「一键更新」时下载的就是这里的产物：包内是可执行文件 +
  # ui/ 目录，由服务端自己替换后再重启（见 core/update/selfupdate.rs）。
  # 两个架构各出一个包，包名与后端挑资产的名字**必须逐字一致**
  # （server_bundle_name()：agent2api-server-linux-amd64 / -arm64.tar.gz）。
  #
  # 为什么走 Dockerfile 而不是直接 cargo build：
  #   · 复用镜像那条已经验证过的编译路径（amd64 原生 / arm64 交叉），
  #     不引入第二套工具链；
  #   · 产物与镜像里的可执行文件**同源同工具链**，glibc 版本天然对齐
  #     （不变量见 Dockerfile 的 bundle 阶段）；
  #   · bundle 阶段是 FROM scratch + 纯 COPY，导出时不进 QEMU。
  # 缓存与 docker.yml 共用同一个 gha scope：依赖桩层已在那边暖过。
  linux-server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建服务端包
        run: |
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --target bundle \
            --output type=local,dest=out \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: 打包并生成校验和
        run: |
          name="agent2api-server-linux-${{ matrix.arch }}.tar.gz"
          mkdir -p dist
          # 包内布局是硬约定：根下 agent2api-server 与 ui/（解包方按名取）
          tar -C out/bundle -czf "dist/$name" agent2api-server ui
          # 校验文件与包同名 + .sha256：面板按这个名字找它，找不到就拒绝安装
          ( cd dist && sha256sum "$name" > "$name.sha256" )
          cat "dist/$name.sha256"
          ls -lh dist

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: linux-server-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # ── Windows 本地包（本地 web 形态：下载 zip 解压双击运行）─────────
  # 与 linux-server 同一套模式：产物只挂 workflow artifact，发版由
  # scripts/release.sh 本地挂到 Release。包内布局与 Linux 版对应 ——
  # 根下 agent2api-server.exe 与 ui/ 目录（ui/ 直接取仓库静态文件，
  # 与 Dockerfile 的 bundle 阶段同源），解压即用。
  #
  # 与桌面 windows job（NSIS 安装包）的分工：那个是「Tauri 壳」形态；
  # 本包是「本地 headless + 浏览器」形态 —— 入口默认只听 127.0.0.1、
  # 启动后自动打开浏览器、数据落 ~/.agent2api（与桌面壳同一目录，
  # 两个形态不能同时跑，SQLite 单写者）。
  #
  # 为什么直接 cargo build 而不复用 Dockerfile：Windows 上没有镜像那条
  # 「amd64 原生 / arm64 交叉」的统一路径，windows-latest runner 自带
  # MSVC 工具链（含 C 链接器，rusqlite bundled 的 SQLite 要用），直接编
  # 最直；步骤与桌面 job 的 Rust 安装同构。产物路径按
  # .cargo/config.toml 的 target-dir 落在仓库根 target/ 下。
  #
  # 打包用 pwsh 的 Compress-Archive（runner 自带，无需额外动作）：
  # zip 内条目保持叶子名（agent2api-server.exe / ui/**），与上面注释的
  # 布局约定一致；校验文件与 Linux job 同格式（<hash>␣␣<name>，面板侧
  # parse_checksum 只取第一个 token）。
  windows-server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: 构建网关二进制
        run: cargo build --release -p agent2api-server
        working-directory: desktop-tauri/src-tauri

      - name: 打包并生成校验和
        shell: pwsh
        run: |
          $name = "agent2api-server-windows-amd64.zip"
          $exe = "$env:GITHUB_WORKSPACE/target/release/agent2api-server.exe"
          $ui = "$env:GITHUB_WORKSPACE/desktop-tauri/ui"
          if (-not (Test-Path $exe)) { throw "找不到网关二进制：$exe" }
          if (-not (Test-Path $ui)) { throw "找不到界面目录：$ui" }
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item $exe "stage/agent2api-server.exe"
          Copy-Item $ui "stage/ui" -Recurse
          # 双击启动器：**在 CI 里现生成**而不是入库 —— .bat 必须是 CRLF +
          # 本机代码页，把它放仓库里迟早被编辑器的 LF/UTF-8 改坏。这里用
          # 数组逐行拼（而不是 here-string）：YAML 块缩进会原样进入
          # here-string 内容，每行前面多出一串空格虽然 cmd 能容忍，但会让
          # `if (` 的右括号判断和 `echo.` 的输出变得可疑；数组拼接没有这个
          # 问题，每行的空格完全由这里决定。内容全 ASCII。
          $lines = @(
            '@echo off'
            'setlocal'
            'cd /d "%~dp0"'
            'if not exist "agent2api-server.exe" ('
            '  echo [error] agent2api-server.exe not found next to this script.'
            '  pause'
            '  exit /b 1'
            ')'
            'if not exist "ui\index.html" ('
            '  echo [error] ui\index.html not found. Keep the ui folder beside the exe.'
            '  pause'
            '  exit /b 1'
            ')'
            'echo.'
            'echo   Agent2API local gateway starting...'
            'echo   The panel opens in your browser. Close this window to stop.'
            'echo.'
            'agent2api-server.exe'
            'echo.'
            'echo   Server stopped.'
            'pause'
          )
          # Out-File -Encoding ascii 在 Windows runner 上写 CRLF
          $lines | Out-File -FilePath "stage/start-windows.bat" -Encoding ascii
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "stage/*" -DestinationPath "dist/$name"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name").Hash.ToLower()
          "$hash  $name" | Out-File -FilePath "dist/$name.sha256" -Encoding ascii
          Get-Content "dist/$name.sha256"
          Get-ChildItem dist

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: windows-server-amd64
          path: dist/*
          if-no-files-found: error
