# 仓库根统一编译缓存目录：
# 从项目根目录或 desktop-tauri/ 执行 cargo（例如带 --manifest-path）时，
# Cargo 不会读取深层子目录 desktop-tauri/src-tauri/.cargo/config.toml，
# 容易在 src-tauri/target/ 下重复编出第二套完整缓存。
# 这里把默认 target-dir 对齐到仓库根 target/；若本机设置了 CARGO_TARGET_DIR
# 环境变量，环境变量优先级更高，仍会走本机指定目录。
# （Linux x86-64 的 rustflags / CFLAGS 保留在 src-tauri/.cargo/config.toml，
# 避免 Cargo 合并多层配置时重复拼接 rustflags，也保持 Dockerfile COPY 路径不变。）
[build]
target-dir = "target"
